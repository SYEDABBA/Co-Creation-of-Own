<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AetherCanvas Synthesizer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        glass: 'rgba(18, 18, 26, 0.75)',
                        glassBorder: 'rgba(255, 255, 255, 0.08)',
                    }
                }
            }
        }
    </script>
    <style> 
        body { background-color: #09090e; color: #e2e8f0; font-family: system-ui, -apple-system, sans-serif; }
        .glass-panel { background: rgba(18, 18, 26, 0.75); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-indigo-500 selection:text-white">
    <header class="w-full border-b border-white/10 glass-panel sticky top-0 z-50 px-6 py-4 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-400 flex items-center justify-center shadow-lg shadow-indigo-500/30">
                <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86 1.517l-.318.318a6 6 0 01-3.86 1.517l-2.387-.477a2 2 0 00-1.022.547l-1.164 1.164a2 2 0 00-.547 1.022l-.477 2.387a2 2 0 001.517 3.86l.318-.318a6 6 0 011.517-3.86l.477-2.387a2 2 0 00.547-1.022l1.164-1.164z"></path></svg>
            </div>
            <span class="font-bold text-lg tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-white via-indigo-200 to-indigo-400">AETHER<span class="text-indigo-400 font-light">CANVAS</span></span>
        </div>
        <div class="flex items-center space-x-4">
            <button id="audioToggle" class="px-4 py-2 rounded-xl bg-white/5 hover:bg-white/10 border border-white/10 text-xs font-medium tracking-wide transition flex items-center space-x-2">
                <span id="audioStatusDot" class="w-2 h-2 rounded-full bg-red-500"></span>
                <span id="audioStatusText">Sound: Off</span>
            </button>
            <button id="downloadBtn" class="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-xs font-semibold text-white tracking-wide transition shadow-lg shadow-indigo-600/30">Export Masterpiece</button>
        </div>
    </header>

    <main class="flex-grow max-w-7xl mx-auto w-full p-6 grid grid-cols-1 lg:grid-cols-4 gap-6">
        <div class="lg:col-span-3 glass-panel rounded-3xl p-6 flex flex-col items-center justify-center relative overflow-hidden shadow-2xl min-h-[500px]">
            <canvas id="artCanvas" class="w-full h-full max-w-[700px] max-h-[700px] aspect-square rounded-2xl cursor-crosshair shadow-inner"></canvas>
            <div class="absolute bottom-8 left-8 bg-black/40 backdrop-blur-md px-4 py-2 rounded-full border border-white/10 text-xs text-gray-400 flex items-center space-x-3">
                <span>FPS: <strong id="fpsCounter" class="text-indigo-400">60</strong></span>
                <span>•</span>
                <span>Particles: <strong id="particleCount" class="text-indigo-400">120</strong></span>
            </div>
        </div>

        <div class="glass-panel rounded-3xl p-6 flex flex-col justify-between space-y-6">
            <div class="space-y-6">
                <h2 class="text-sm font-semibold tracking-wider text-gray-300 uppercase">Synthesis Controls</h2>
                <div class="space-y-4">
                    <div>
                        <label class="text-xs text-gray-400 flex justify-between mb-1"><span>Complexity Nodes</span><span id="nodesVal" class="text-indigo-400 font-mono">6</span></label>
                        <input type="range" id="nodesRange" min="3" max="12" value="6" class="w-full accent-indigo-500 bg-white/10 h-1.5 rounded-lg appearance-none cursor-pointer">
                    </div>
                    <div>
                        <label class="text-xs text-gray-400 flex justify-between mb-1"><span>Rotation Velocity</span><span id="speedVal" class="text-indigo-400 font-mono">1.5x</span></label>
                        <input type="range" id="speedRange" min="0.1" max="4.0" step="0.1" value="1.5" class="w-full accent-indigo-500 bg-white/10 h-1.5 rounded-lg appearance-none cursor-pointer">
                    </div>
                    <div>
                        <label class="text-xs text-gray-400 flex justify-between mb-1"><span>Color Hue Harmonic</span><span id="hueVal" class="text-indigo-400 font-mono">220°</span></label>
                        <input type="range" id="hueRange" min="0" max="360" value="220" class="w-full accent-indigo-500 bg-white/10 h-1.5 rounded-lg appearance-none cursor-pointer">
                    </div>
                    <div>
                        <label class="text-xs text-gray-400 flex justify-between mb-1"><span>Harmonic Frequency</span><span id="freqVal" class="text-indigo-400 font-mono">432Hz</span></label>
                        <input type="range" id="freqRange" min="100" max="880" step="1" value="432" class="w-full accent-indigo-500 bg-white/10 h-1.5 rounded-lg appearance-none cursor-pointer">
                    </div>
                </div>
            </div>

            <div class="space-y-3 pt-6 border-t border-white/10">
                <button id="randomizeBtn" class="w-full py-3 rounded-xl bg-white/5 hover:bg-white/10 border border-white/10 text-xs font-semibold tracking-wide transition text-gray-200">Randomize Matrix</button>
                <button id="clearBtn" class="w-full py-3 rounded-xl bg-red-500/10 hover:bg-red-500/20 border border-red-500/20 text-xs font-semibold tracking-wide transition text-red-400">Reset Canvas</button>
            </div>
        </div>
    </main>

    <footer class="w-full border-t border-white/10 glass-panel mt-12 py-8 px-6">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-6">
            <div class="flex flex-col space-y-2 text-center md:text-left">
                <div class="flex items-center justify-center md:justify-start space-x-2 text-sm font-bold text-indigo-300">
                    <svg class="w-5 h-5 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>
                    <span>Cause-Driven Philanthropy Initiative</span>
                </div>
                <p class="text-xs text-gray-400 max-w-xl leading-relaxed">
                    95% of all contributions go directly towards Cancer Patient Support & School Education Initiatives (5% retained for server maintenance).
                </p>
            </div>
            <div class="flex items-center space-x-4 bg-black/40 border border-white/10 p-4 rounded-2xl">
                <img src="https://api.qrserver.com/v1/create-qr-code/?data=upi://pay?pa=donation1@postbank&pn=YUGRAAL_Cause" alt="UPI Donation QR" class="w-16 h-16 rounded-xl bg-white p-1">
                <div class="flex flex-col space-y-1">
                    <span class="text-xs font-semibold text-gray-300">Receiver: ASKAR ALI</span>
                    <span class="text-[11px] font-mono text-indigo-400" id="upiIdText">donation1@postbank</span>
                    <button id="copyUpiBtn" class="mt-1 px-3 py-1 bg-indigo-600 hover:bg-indigo-500 text-[10px] font-bold text-white rounded-lg transition self-start">Copy UPI ID</button>
                </div>
            </div>
        </div>
    </footer>

    <script>
        // Canvas Application Engine
        const canvas = document.getElementById('artCanvas');
        const ctx = canvas.getContext('2d');
        
        function resizeCanvas() {
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = 600;
            canvas.height = 600;
        }
        resizeCanvas();

        let angle = 0;
        let nodes = 6;
        let speed = 1.5;
        let baseHue = 220;
        let audioCtx = null;
        let osc = null;
        let gainNode = null;
        let isAudioRunning = false;

        // UI Controls
        const nodesRange = document.getElementById('nodesRange');
        const speedRange = document.getElementById('speedRange');
        const hueRange = document.getElementById('hueRange');
        const freqRange = document.getElementById('freqRange');
        
        nodesRange.oninput = (e) => { nodes = parseInt(e.target.value); document.getElementById('nodesVal').innerText = nodes; };
        speedRange.oninput = (e) => { speed = parseFloat(e.target.value); document.getElementById('speedVal').innerText = speed + 'x'; };
        hueRange.oninput = (e) => { baseHue = parseInt(e.target.value); document.getElementById('hueVal').innerText = baseHue + '°'; };
        freqRange.oninput = (e) => { 
            const val = e.target.value;
            document.getElementById('freqVal').innerText = val + 'Hz';
            if(osc) osc.frequency.setValueAtTime(val, audioCtx.currentTime);
        };

        document.getElementById('randomizeBtn').onclick = () => {
            nodesRange.value = Math.floor(Math.random() * 9) + 3;
            speedRange.value = (Math.random() * 3.5 + 0.5).toFixed(1);
            hueRange.value = Math.floor(Math.random() * 360);
            freqRange.value = Math.floor(Math.random() * 600) + 150;
            nodesRange.dispatchEvent(new Event('input'));
            speedRange.dispatchEvent(new Event('input'));
            hueRange.dispatchEvent(new Event('input'));
            freqRange.dispatchEvent(new Event('input'));
        };

        document.getElementById('clearBtn').onclick = () => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        };

        // Animation Loop
        function draw() {
            ctx.fillStyle = 'rgba(9, 9, 14, 0.08)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            const radius = 180;

            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(angle);

            for (let i = 0; i < nodes; i++) {
                const theta = (i * 2 * Math.PI) / nodes;
                const x = radius * Math.cos(theta);
                const y = radius * Math.sin(theta);

                ctx.beginPath();
                ctx.arc(x, y, 40 + Math.sin(angle * 2) * 15, 0, Math.PI * 2);
                ctx.fillStyle = `hsla(${(baseHue + i * (360 / nodes)) % 360}, 80%, 60%, 0.15)`;
                ctx.fill();
                ctx.strokeStyle = `hsla(${(baseHue + i * (360 / nodes)) % 360}, 90%, 70%, 0.6)`;
                ctx.lineWidth = 1.5;
                ctx.stroke();

                // Connect lines
                for (let j = i + 1; j < nodes; j++) {
                    const theta2 = (j * 2 * Math.PI) / nodes;
                    const x2 = radius * Math.cos(theta2);
                    const y2 = radius * Math.sin(theta2);
                    ctx.beginPath();
                    ctx.moveTo(x, y);
                    ctx.lineTo(x2, y2);
                    ctx.strokeStyle = `hsla(${baseHue}, 70%, 50%, 0.2)`;
                    ctx.stroke();
                }
            }
            ctx.restore();
            angle += 0.005 * speed;
            requestAnimationFrame(draw);
        }
        requestAnimationFrame(draw);

        // Audio Synthesis Logic
        document.getElementById('audioToggle').onclick = () => {
            if (!isAudioRunning) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                osc = audioCtx.createOscillator();
                gainNode = audioCtx.createGain();
                
                osc.type = 'sine';
                osc.frequency.setValueAtTime(parseInt(freqRange.value), audioCtx.currentTime);
                
                gainNode.gain.setValueAtTime(0.05, audioCtx.currentTime);
                osc.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                osc.start();

                isAudioRunning = true;
                document.getElementById('audioStatusDot').className = 'w-2 h-2 rounded-full bg-emerald-500 animate-pulse';
                document.getElementById('audioStatusText').innerText = 'Sound: Active';
            } else {
                if(osc) { osc.stop(); osc.disconnect(); }
                if(audioCtx) audioCtx.close();
                isAudioRunning = false;
                document.getElementById('audioStatusDot').className = 'w-2 h-2 rounded-full bg-red-500';
                document.getElementById('audioStatusText').innerText = 'Sound: Off';
            }
        };

        // Export functionality
        document.getElementById('downloadBtn').onclick = () => {
            const link = document.createElement('a');
            link.download = 'aether-canvas-masterpiece.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        };

        // Copy UPI ID functionality
        document.getElementById('copyUpiBtn').onclick = () => {
            navigator.clipboard.writeText('donation1@postbank');
            const btn = document.getElementById('copyUpiBtn');
            btn.innerText = 'Copied!';
            setTimeout(() => btn.innerText = 'Copy UPI ID', 2000);
        };
    </script>
</body>
</html>
